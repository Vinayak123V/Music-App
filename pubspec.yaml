name: bhakti_music
description: "Bhakti Music - Your Daily Devotional Music Streaming App & Admin Dashboard."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing and Navigation
  go_router: ^14.2.0

  # Firebase Core and Services
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1

  # Audio Playback and Background Service
  just_audio: ^0.9.38
  just_audio_platform_interface: ^4.6.0
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.19

  # Local Persistence
  shared_preferences: ^2.2.3

  # File Picking for Admin Web/Mobile Upload
  file_picker: ^8.0.5

  # Image Caching
  cached_network_image: ^3.3.1

  # Formatting and Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/placeholders/
